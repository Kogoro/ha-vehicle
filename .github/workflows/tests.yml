name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 resolves an older Home Assistant, 3.14 the newest release
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend
      - run: pytest -q

name: Release

# Publish a release from the version in custom_components/vehicle/manifest.json:
#   - run this workflow manually (Actions -> Release -> Run workflow), or
#   - push a tag like v0.1.0 (it must match the manifest version).
# The release notes come from the matching section of CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(python3 -c "import json; print(json.load(open('custom_components/vehicle/manifest.json'))['version'])")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '$0 ~ "^## \\[?" v "\\]?$" {found=1; next} /^## / {found=0} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md section for ${{ steps.version.outputs.version }}" >&2; exit 1; }

      - name: Create zip for release
        run: |
          cd custom_components/vehicle
          zip -r ../../vehicle.zip . -x "__pycache__/*" "*/__pycache__/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: vehicle.zip

set_odometer:
  fields:
    entity_id: &vehicle_entity
      required: true
      selector:
        entity:
          integration: vehicle
    odometer:
      required: true
      example: 45210
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    allow_decrease:
      default: false
      selector:
        boolean:

add_fuel:
  fields:
    entity_id: *vehicle_entity
    liters:
      required: true
      example: 42.3
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
          unit_of_measurement: L
    total_cost:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    price_per_liter:
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          mode: box
    odometer:
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    full_tank:
      default: true
      selector:
        boolean:
    date:
      selector:
        date:

add_charge:
  fields:
    entity_id: *vehicle_entity
    kwh:
      required: true
      example: 35.5
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    total_cost:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    price_per_kwh:
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          mode: box
    odometer:
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    date:
      selector:
        date:

complete_service:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: vehicle
    odometer:
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.1
          mode: box
          unit_of_measurement: km
    date:
      selector:
        date:
